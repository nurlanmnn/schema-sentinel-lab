syntax = "proto3";
package simulation.inventory;
message StockItem {
  string sku = 1;
  int32 quantity = 2;
  StockState state = 3;
  repeated string display_labels = 4;
  string warehouse = 7;
  string drop_zone = 8;
}

enum StockState {
  STOCK_STATE_UNSPECIFIED = 0;
  STOCK_STATE_QUARANTINED = 1;
}
